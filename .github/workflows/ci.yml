name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false  # a failure on one Python version must not hide the other
      matrix:
        python-version: ["3.12", "3.13"]
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest

  frontend:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  docker:
    # The image published on Render: it must build, and the server in it must answer.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - run: docker build -t mobimix .
      - name: Start it and ask
        run: |
          docker run -d --name mobimix -p 10000:10000 mobimix
          for attempt in $(seq 1 30); do
            curl -fs http://localhost:10000/api/health && break
            sleep 1
          done
          curl -fs http://localhost:10000/api/health
          curl -fs http://localhost:10000/ | grep -q "MobiMix"
      - name: Server log
        if: always()
        run: docker logs mobimix
