# Demo household D - peripheral household, poor public transport, long commute, one child.
# Expected behaviour: the car is essential; no PT-based portfolio should be feasible for the long
# time-critical commute. The interesting question is the car type (diesel vs alternatives) and
# whether a cheap second vehicle (scooter / e-bike) helps the short trips, not "sell the car".
id: peripheral_family
mode: QUICK
household:
  adults:
    - id: p1
      age_range: A35_44
      has_license: true
      occupation: WORKER
      work_or_study:
        one_way_distance_km: {exact: 35}
        days_per_week: {exact: 5}
        remote_days_per_week: {exact: 0}
        time_critical: true
    - id: p2
      age_range: A35_44
      has_license: true
      occupation: WORKER
      work_or_study:
        one_way_distance_km: {exact: 8}
        days_per_week: {exact: 3}
        remote_days_per_week: {exact: 0}
        time_critical: false
  n_children: 1
  location:
    area_type: PERIPHERAL
    pt_quality: LOW
    sharing_availability: LOW
  family_logistics: [SCHOOL_ESCORT]
  simultaneous_car_need: SOMETIMES
vehicles:
  - id: car1
    option_id: car_diesel
    primary_user_id: p1
    annual_km: {exact: 18000}
    parking_cost_year: {exact: 0}
other_mobility:
  weekend_trips_per_year: {exact: 20}
  weekend_trip_distance_km_one_way: {exact: 50}
  holiday_trips_per_year: {exact: 2}
  holiday_distance_km_one_way: {exact: 450}
