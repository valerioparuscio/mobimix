# Demo household C - family with two children, two cars, suburban, significant weekend travel.
# Expected behaviour (brief section 31): must NOT recommend 0 cars - simultaneous commuting plus
# school escort plus frequent family weekends make a car-free setup unrealistic. A one-car portfolio
# is a legitimate candidate only if the cost of covering the "both need a car" days is accounted for.
id: family_two_cars
mode: QUICK
household:
  adults:
    - id: p1
      age_range: A35_44
      has_license: true
      occupation: WORKER
      work_or_study:
        one_way_distance_km: {exact: 15}
        days_per_week: {exact: 5}
        remote_days_per_week: {exact: 1}
        time_critical: true
    - id: p2
      age_range: A35_44
      has_license: true
      occupation: WORKER
      work_or_study:
        one_way_distance_km: {exact: 10}
        days_per_week: {exact: 4}
        remote_days_per_week: {exact: 0}
        time_critical: false
  n_children: 2
  location:
    area_type: SUBURBAN
    municipality: Sesto San Giovanni
    pt_quality: MEDIUM
    sharing_availability: LOW
  family_logistics: [SCHOOL_ESCORT, CHILD_ACTIVITIES]
  simultaneous_car_need: OFTEN
vehicles:
  - id: car1
    option_id: car_medium_petrol
    primary_user_id: p1
    annual_km: {low: 12000, high: 16000}
    parking_cost_year: {exact: 250}
  - id: car2
    option_id: car_small_petrol
    primary_user_id: p2
    annual_km: {low: 5000, high: 9000}
    parking_cost_year: {exact: 250}
other_mobility:
  weekend_trips_per_year: {exact: 25}
  weekend_trip_distance_km_one_way: {exact: 70}
  long_distance_weekends_per_year: {exact: 4}
  holiday_trips_per_year: {exact: 2}
  holiday_distance_km_one_way: {exact: 500}
