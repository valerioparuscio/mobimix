# Demo household A - single adult in the city centre, one small car, public transport available.
# Expected behaviour (regression, brief section 31): a car-light or car-free portfolio should be
# feasible and clearly cheaper (parking alone is ~1,800 EUR/year); the engine must still flag the
# loss of flexibility for weekend and holiday trips instead of just maximising savings.
id: urban_single
mode: QUICK
household:
  adults:
    - id: p1
      age_range: A35_44
      has_license: true
      occupation: WORKER
      work_or_study:
        one_way_distance_km: {exact: 5}
        days_per_week: {exact: 5}
        remote_days_per_week: {exact: 1}
        time_critical: false
  n_children: 0
  location:
    area_type: CITY_CENTER
    municipality: Milano
    pt_quality: HIGH
    sharing_availability: HIGH
vehicles:
  - id: car1
    option_id: car_small_petrol
    primary_user_id: p1
    annual_km: {low: 4000, high: 8000}
    parking_cost_year: {exact: 1800}
other_mobility:
  taxi_trips_per_year: {exact: 6}
preferences:
  save_money: 4
  reduce_travel_time: 3
  comfort: 3
  flexibility: 3
