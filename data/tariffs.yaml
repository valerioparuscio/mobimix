    cost_per_trip: {value: 0, confidence: HIGH, notes: "Costo marginale nullo: incluso nel titolo di viaggio."}
    average_speed_kmh:
      URBAN: {value: 18, low: 14, high: 24, notes: "Velocita' commerciale media su un mix metro/tram/bus; stima."}
      REGIONAL: {value: 30, low: 22, high: 38}
