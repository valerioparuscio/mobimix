# Tariff-based options: SUBSCRIPTIONS and PAY-PER-USE services (public transport, rail,
# taxi, sharing, rental, air). Owned assets are in mobility_options.yaml; scores in
# comfort_scores.yaml. Schema: backend/app/models/options.py (MobilityOption).
#
# Geographic scope: Milan area unless an entry overrides `geographic_scope`. Tariffs of
# other cities are NOT modelled yet (Phase 3 of the data roadmap). Entries marked
# `placeholder: true` have no verified source and exist only so the catalogue is complete.

meta:
  geographic_scope: IT-MI
  valid_from: 2026-01-01

