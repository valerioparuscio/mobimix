# Mobility options catalogue - OWNED assets and walking. Tariff-based options (subscriptions,
# pay-per-use services) are in tariffs.yaml; comfort / flexibility / reliability scores are in
# comfort_scores.yaml. Schema: backend/app/models/options.py (MobilityOption).
#
# Cost conventions: purchase_price - residual_value over expected_lifetime_years gives the
# annual depreciation. Energy cost is NOT stored here: it is consumption x the price in
# model_parameters.yaml. Parking is NOT stored here: it is user-specific (see
# default_profiles.yaml). All prices EUR incl. VAT, 2026, for a NEW vehicle held 8 years
# unless stated. A bare number is an unsourced LOW-confidence assumption.
#
# Speeds are door-to-door averages in km/h per trip band (see bands.* in
# model_parameters.yaml), WITHOUT the fixed per-trip overhead (fixed_time_min_per_trip).

meta:
  geographic_scope: IT
  valid_from: 2026-01-01

options:
  # ============================ CARS ======================================================
  - id: car_small_petrol
    uses_motorways: true
    parks_at_destination: true
    name: Utilitaria a benzina
    type: CAR_SMALL_PETROL
    mode: CAR
    ownership: OWNED
    description: Segmento A/B nuova (tipo Panda, Yaris, Clio), tenuta 8 anni.
    purchase_price: {value: 17000, low: 14000, high: 20000, confidence: MEDIUM, source: sum_money_costo_auto, notes: "Il simulatore usa 16.000 EUR; 17.000 e' una stima per un'auto nuova nel 2026."}
    residual_value: {value: 7000, low: 5000, high: 8500, confidence: LOW, source: sum_money_costo_auto, notes: "Svalutazione ~10%/anno composta su 8 anni = ~43% del prezzo."}
    expected_lifetime_years: {value: 8, low: 6, high: 12, notes: "Periodo di detenzione assunto. Eta' media del parco: 13 anni (ACI)."}
    maintenance_cost_year: {value: 420, low: 320, high: 550, notes: "Tagliandi, revisione, ricambi. Stima; per un'auto media diesel Alvolante riporta 314-600."}
    insurance_cost_year: {value: 560, low: 430, high: 900, confidence: LOW, source: ivass_rc_auto_2025, notes: "RC media 438 EUR + garanzie accessorie (furto/incendio). Milano e' sopra la media."}
    tax_cost_year: {value: 150, low: 100, high: 200, notes: "Bollo: varia per regione e potenza."}
    energy: {carrier: PETROL, consumption_per_100km: {value: 6.0, low: 5.0, high: 7.0, notes: "Consumo reale, non omologato."}}
    cost_per_km: {value: 0.03, low: 0.02, high: 0.04, notes: "Pneumatici e usura non coperti dalla manutenzione fissa."}
    average_speed_kmh:
      URBAN: {value: 22, low: 18, high: 28}
      REGIONAL: {value: 55, low: 45, high: 70}
      LONG: {value: 85, low: 75, high: 100}
    fixed_time_min_per_trip: {value: 8, low: 3, high: 15, notes: "Ricerca parcheggio e tragitto a piedi."}
    capacity: 5
    luggage_capacity: MEDIUM
    max_practical_distance_km: 1000
    weather_sensitivity: LOW
    requires_license: true

