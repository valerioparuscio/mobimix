# Statistical defaults for missing answers, by residential context (AreaType).
# Used by the demand estimator when the user answers "I don't know" (brief section 8).
#
# ALL VALUES ARE PLACEHOLDERS: reasoned estimates anchored to the national averages in
# model_parameters.yaml (statistics.*), NOT derived from a dataset. They exist so the
# pipeline can run end to end; replace them with ISTAT / Audimob / municipal data per area
# (data roadmap, Phase 2-3) or with Car Independence Index based priors.
#
# Keys (the estimator relies on all of them):
#   car_annual_km_first / _second          km/year driven by the first / second car
#   parking_cost_year_per_car              EUR/year, garage or permit
#   workplace_car_cost_per_day             EUR/day, parking and Area C paid by a car at the
#                                          workplace (average over all commuters, free places included)
#   local_trip_car_cost                    EUR per outing, parking of a car on a shopping or leisure
#                                          trip in town (average, free places included)
#   commute_distance_km_one_way            km, when the user does not know it
#   work_days_per_week                     days/week of work or study before remote work
#   local_trips_per_week_per_adult         round trips/week for shopping, errands, leisure
#   local_trip_distance_km_one_way         km
#   school_escort_distance_km_one_way      km, per child-escort trip
#   weekend_trips_per_year                 household outings, ~1 day, 30-100 km
#   weekend_trip_distance_km_one_way       km
#   long_weekends_per_year                 household long-distance weekends
#   long_weekend_distance_km_one_way       km
#   holiday_trips_per_year                 household holiday round trips
#   holiday_distance_km_one_way            km
#   taxi_trips_per_year, car_sharing_trips_per_year, rail_trips_per_year, flights_per_year,
#   bike_scooter_sharing_trips_per_year   household totals (trips/year)
#   car_rental_days_per_year              household total (days/year)

