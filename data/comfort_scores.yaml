# Comfort, flexibility and reliability of each option, on a 0-10 scale, with the reason for
# each score. EDIT THE NUMBERS FREELY: this file is meant to be reviewed by the product owner.
#
# What the scores mean
#   comfort      10 = protected from weather, seated, no physical effort, no crowding, easy with
#                     luggage and children;  0 = exposed, tiring, crowded, hard with luggage.
#   flexibility  10 = available at any time and to any destination, no booking, no timetable;
#                     0 = fixed timetable, fixed stops, booking required.
#   reliability  10 = arrives when planned almost always;  0 = frequent delays, cancellations.
#
# ALL VALUES ARE STILL PLACEHOLDERS (first draft by Claude, not yet reviewed). They are
# subjective modelling choices that belong to the product owner. Brief section 17.3: comfort
# may eventually depend on transfers, weather, crowding, luggage, children, seat availability
# and trip length; for the MVP it is one coefficient per option.

